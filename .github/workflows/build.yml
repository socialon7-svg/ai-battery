# dmg(macOS)와 exe(Windows)를 GitHub 서버에서 만듭니다.
# - Actions 탭 → Build → Run workflow 를 누르거나 main 에 push 하면 실행되고,
#   결과는 그 실행의 Artifacts(AI-Battery-mac / AI-Battery-windows)에서 내려받습니다.
# - v1.1.0 같은 태그를 push 하면 Release 에 파일이 자동으로 첨부됩니다.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: AI-Battery-mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: AI-Battery-windows
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
